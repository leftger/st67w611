[package]
name = "stm32n6570-dk"
version = "0.1.0"
edition = "2021"

# Standalone board crate: `embassy-stm32` allows exactly one chip feature, so
# the N6 example cannot live alongside the main crate's WBA55 dev-deps.
#
# embassy deps are pinned to a `rev` of embassy-rs/embassy rather than a
# crates.io release: embassy-stm32 0.5.0 has no N6 `ic14` kernel-clock field,
# and without it SPI5's kernel clock stays at 0 and every SPI transfer hangs.
# The rev is the exact upstream commit this bring-up was validated against.
# Every embassy crate must come from the same source — mixing sources yields
# two distinct `embassy_time`/`embassy_sync` types and a wall of type errors.
[dependencies]
st67w611 = { path = "../..", default-features = false, features = ["mission-t02", "defmt"] }

embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "63534e7971c4a6cbe4ceb9987fe6f853462040f7", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "63534e7971c4a6cbe4ceb9987fe6f853462040f7", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "63534e7971c4a6cbe4ceb9987fe6f853462040f7", features = ["defmt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "63534e7971c4a6cbe4ceb9987fe6f853462040f7", features = ["defmt", "stm32n657x0", "time-driver-any", "exti"] }

embedded-hal = "1.0"
embedded-hal-async = "1.0"

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

# Force anything still asking for embassy-time from crates.io onto the same
# local checkout.
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "63534e7971c4a6cbe4ceb9987fe6f853462040f7" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "63534e7971c4a6cbe4ceb9987fe6f853462040f7" }

[profile.release]
opt-level = "s"
lto = true
