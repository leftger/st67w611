[package]
name = "nucleo-wba65ri"
version = "0.1.0"
edition = "2021"
# A firmware example, not a library: never publish it.
publish = false
# `src/bin/` holds the extra bring-up tests, so `cargo run` needs to be told
# which one is the real firmware.
default-run = "nucleo-wba65ri"

# Standalone board crate: `embassy-stm32` allows exactly one chip feature.
#
# Why this board: on the STM32N6570-DK the USB-C cable physically blocks the
# ST67 module from seating on the Arduino header, which left the header contacts
# marginal and the module behaving erratically (see the N6 board crate for the
# full trail). The NUCLEO-WBA65RI has the same Arduino header positions free.
#
# embassy deps are pinned to a `rev` of embassy-rs/embassy rather than a crates.io
# release, and every embassy crate must come from the same source — mixing
# sources yields two distinct `embassy_time`/`embassy_sync` types.
[dependencies]
st67w611 = { path = "../..", default-features = false, features = ["mission-t02", "defmt"] }

embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["defmt"] }
# `memory-x` generates memory.x from the metapac, so there is no hand-written
# linker script to get wrong (unlike the N6, which needed a very specific
# boot-ROM dev-mode window).
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["defmt", "stm32wba65ri", "time-driver-any", "memory-x", "exti"] }
# The stack itself, for the T02 (xarxa) path. Must be the same git source as
# the rest of the embassy crates, or the driver types come from two worlds.
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = [
    "defmt",
    "medium-ethernet",
    "ipv4",
    "ipv6",
    "tcp",
    "tcp-listener",
    "udp",
    "dhcpv4",
    # The USB portal hands addresses to the host over CDC-NCM.
    "dhcpv4-server",
    "dns",
] }
# USB device stack: the board enumerates as an Ethernet gadget (CDC-NCM) on the
# user USB-C connector, so credentials can be provisioned without Wi-Fi.
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = [
    "defmt",
    "class-cdc-ncm",
] }

embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io-async = "0.7"
# Fixed-capacity strings for formatting the live telemetry lines without alloc.
heapless = { version = "0.8", default-features = false }

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

# Force anything still asking for embassy-time from crates.io onto the same rev.
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }

[profile.release]
opt-level = "s"
lto = true
debug = 2
