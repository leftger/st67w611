[package]
name = "st67w611"
version = "0.1.0"
edition = "2021"
authors = ["Gerzain Mata <leftger@gmail.com>"]
description = "Async no_std driver for ST67W611 WiFi modules using Embassy framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/st67w611"
readme = "README.md"
keywords = ["embedded", "wifi", "embassy", "async", "no-std"]
categories = ["embedded", "no-std", "network-programming"]
# Lowest toolchain the T01 library was built with (1.90 through current stable);
# nothing older was available to test.
rust-version = "1.90"
# Dev tooling and the board crates are not part of the library. (`boards/*` have
# their own Cargo.toml, so cargo already leaves them out; listed for clarity.)
exclude = ["/scripts/", "/boards/", "/.claude/", "/.cargo/", "/.editorconfig"]

[package.metadata.docs.rs]
# Exactly one firmware feature is meant to be active; document the default.
features = ["mission-t01"]

[dependencies]
# All embassy crates come from one pinned upstream git revision, so the whole
# build shares one source: mixing git and crates.io copies of the same crate
# yields two distinct `embassy_time`/`embassy_sync` types and a wall of
# type-mismatch errors.
#
# Each also carries a `version`. Cargo builds from the git source and ignores the
# version locally; `cargo publish` drops the `git` part and keeps the version,
# which is what crates.io needs. The released embassy-executor 0.10, embassy-time
# 0.5 and embassy-sync 0.8 were checked to build and pass the unit tests with the
# T01 library, so they are not what blocks a release (see `embassy-net` below).
embassy-executor = { version = "0.10", git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }
embassy-time = { version = "0.5", git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }
embassy-sync = { version = "0.8", git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }
embassy-futures = "0.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
heapless = { version = "0.8", default-features = false }
static_cell = "2"

# Optional dependencies
defmt = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }

# TLS over embassy-net TCP. `embedded-tls` 0.19 speaks `embedded-io-async` 0.7,
# the same version embassy-net uses, so it wraps a `TcpSocket` directly.
embedded-tls = { version = "0.19", optional = true, default-features = false }

# Xarxa-based embassy-net for the T02 raw-L2 driver.
#
# RELEASE BLOCKER for crates.io. The released embassy-net 0.9.1 is smoltcp-based
# and depends on `smoltcp`; the pinned git revision is *also* versioned 0.9.1 but
# is xarxa-based (it depends on `xarxa`) and has features the release lacks
# (`ipv4`, `ipv6`, `medium-ethernet`, `tcp-listener`, ...). Same version number,
# different code. So `cargo publish` cannot resolve this dependency until the
# xarxa-based embassy-net is released. When it is, drop `git`/`rev` here (and for
# `embassy-net-driver-channel`) and delete the `[patch.crates-io]` section below.
embassy-net = { version = "0.9", git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", optional = true, default-features = false, features = [
    "medium-ethernet",
    "ipv4",
    "ipv6",
    "tcp",
    "udp",
    "dhcpv4",
    "dns",
] }
embassy-net-driver-channel = { version = "0.4", git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", optional = true }

[dev-dependencies]
# (intentionally empty: see the target-scoped block below)

# Embedded-only dependencies (examples and on-target tests). Scoping them to
# 32-bit ARM keeps `cargo test --lib` runnable on the host, where cortex-m and
# embassy-stm32 cannot be built.
[target.'cfg(target_arch = "arm")'.dev-dependencies]
# STM32WBA55CG dependencies
embassy-stm32 = { version = "0.5.0", features = ["defmt", "stm32wba55cg", "time-driver-any", "memory-x", "exti"] }
# These three also appear in [dependencies] as path deps into the embassy git
# checkout, and cargo requires a single canonical source per dependency name,
# so they have to match here. (embassy-stm32 itself is dev-only, so it can stay
# on the crates.io release.)
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced", features = [
    "defmt",
    "tcp",
    "udp",
    "dhcpv4",
    "dns",
    "ipv4",
    "ipv6",
    "medium-ethernet",
] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[features]
default = ["mission-t01"]

# Firmware architecture selection (exactly one).
#
# T01: the module owns TCP/IP; the host drives AT sockets.
# T02: the host owns TCP/IP; the module provides raw L2 frames and the
#      xarxa-based `embassy-net` stack runs on top.
mission-t01 = []
mission-t02 = ["dep:embassy-net", "dep:embassy-net-driver-channel"]

# TLS client (`embedded-tls`) over any embedded-io-async socket, so it works on
# either firmware.
tls = ["dep:embedded-tls"]

# Logging
defmt = ["dep:defmt", "embassy-executor/defmt", "embassy-sync/defmt", "embassy-time/defmt", "heapless/defmt-03"]
log = ["dep:log"]

# Diagnostic examples (work with both T01 and T02 firmware). All examples log
# through defmt, which `st67w611::Error` only implements with the `defmt` feature.
[[example]]
name = "stm32wba55_spi_diagnostic"
required-features = ["defmt"]

[[example]]
name = "stm32wba55_diagnostic_wifi_scan"
required-features = ["defmt"]

[[example]]
name = "stm32wba55_minimal_test"
required-features = ["defmt"]

[[example]]
name = "stm32wba55_debug_rdy"
required-features = ["defmt"]

[[example]]
name = "stm32wba55_firmware_programmer"
required-features = ["defmt"]

# T01 examples (AT command-based networking on module)
[[example]]
name = "stm32wba55_t01_wifi_scan"
required-features = ["mission-t01", "defmt"]

[[example]]
name = "stm32wba55_t01_wifi_test"
required-features = ["mission-t01", "defmt"]

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false

# TEMPORARY, development only (cargo ignores this section when publishing).
#
# The xarxa-based embassy-net is not on crates.io yet, so the `embassy-net` /
# `embassy-net-driver-channel` dependencies above come from the pinned embassy git
# revision. That revision's `embassy-time` uses a *path* dependency on
# `embassy-time-driver`, which cannot coexist with the crates.io copy (both
# declare `links = "embassy-time"`). Patching both to the same revision unifies
# them.
#
# Remove this section, and drop `git`/`rev` from the dependencies above, once
# xarxa is released.
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "398bd5540a95ebbc478baf6ae6eddb00ae821ced" }
