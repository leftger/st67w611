[package]
name = "st67w611"
version = "0.1.0"
edition = "2021"
authors = ["Gerzain Mata <leftger@gmail.com>"]
description = "Async no_std driver for ST67W611 WiFi modules using Embassy framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/st67w611"
keywords = ["embedded", "wifi", "embassy", "async", "no-std"]
categories = ["embedded", "no-std", "network-programming"]

[dependencies]
embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-futures = "0.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.6"
embedded-io-async = "0.6"
heapless = { version = "0.8", default-features = false }
static_cell = "2"

# Optional dependencies
defmt = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }

# embassy-net support (T02 firmware only)
embassy-net-driver = { version = "0.2.0", optional = true }

[dev-dependencies]
# STM32WBA55CG dependencies
embassy-stm32 = { version = "0.5.0", features = ["defmt", "stm32wba65ri", "time-driver-any", "memory-x", "exti"] }
embassy-executor = { version = "0.9.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.8.0", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet"] }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = "0.8"
static_cell = "2"

[features]
default = ["mission-t01"]

# Firmware architecture selection (mutually exclusive)
# T01: TCP/IP stack runs on the ST67W611 module (AT command sockets)
# T02: TCP/IP stack runs on the host MCU (embassy-net integration)
mission-t01 = []
mission-t02 = ["dep:embassy-net-driver"]

# Logging
defmt = ["dep:defmt", "embassy-executor/defmt", "embassy-sync/defmt", "embassy-time/defmt", "heapless/defmt-03"]
log = ["dep:log"]

# Diagnostic examples (work with both T01 and T02 firmware)
[[example]]
name = "stm32wba65_spi_diagnostic"
required-features = []

[[example]]
name = "stm32wba55_diagnostic_wifi_scan"
required-features = []

[[example]]
name = "stm32wba55_minimal_test"
required-features = []

[[example]]
name = "stm32wba65_debug_rdy"
required-features = []

[[example]]
name = "stm32wba55_firmware_programmer"
required-features = []

[[example]]
name = "stm32wba65_firmware_programmer"
required-features = []

# T01 examples (AT command-based networking on module)
[[example]]
name = "stm32wba65_t01_wifi_scan"
required-features = ["mission-t01", "defmt"]

[[example]]
name = "stm32wba55_t01_wifi_scan"
required-features = ["mission-t01", "defmt"]

[[example]]
name = "stm32wba55_t01_wifi_test"
required-features = ["mission-t01", "defmt"]

# T02 examples (embassy-net on host MCU)
[[example]]
name = "stm32wba55_t02_embassy_net"
required-features = ["mission-t02"]

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
