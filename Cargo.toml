[package]
name = "st67w611-driver"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Async no_std driver for ST67W611 WiFi modules using Embassy framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/st67w611-driver"
keywords = ["embedded", "wifi", "embassy", "async", "no-std"]
categories = ["embedded", "no-std", "network-programming"]

[dependencies]
embassy-executor = "0.7"
embassy-time = "0.3"
embassy-sync = "0.6"
embassy-net = { version = "0.5", features = ["tcp", "udp", "dhcpv4"] }
embassy-futures = "0.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.6"
embedded-io-async = "0.6"
heapless = "0.8"

# Optional dependencies
defmt = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
embassy-executor = { version = "0.7", features = ["nightly", "arch-cortex-m", "executor-thread"] }

[features]
default = []
defmt = ["dep:defmt", "embassy-executor/defmt", "embassy-net/defmt", "embassy-sync/defmt", "embassy-time/defmt"]
log = ["dep:log"]

[[example]]
name = "wifi_scan"
required-features = []

[[example]]
name = "tcp_client"
required-features = []

[[example]]
name = "mqtt_client"
required-features = []

[[example]]
name = "https_request"
required-features = []

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
