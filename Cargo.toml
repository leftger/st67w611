[package]
name = "st67w611"
version = "0.1.0"
edition = "2021"
authors = ["Gerzain Mata <leftger@gmail.com>"]
description = "Async no_std driver for ST67W611 WiFi modules using Embassy framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/st67w611"
keywords = ["embedded", "wifi", "embassy", "async", "no-std"]
categories = ["embedded", "no-std", "network-programming"]
# Board-specific example crates live under examples/ as workspace members;
# they must not be packaged with the published library.
exclude = ["examples"]

# Per-board example programs are separate crates (one per MCU) so each can
# select its own embassy-stm32 chip feature and probe-rs runner. See
# examples/stm32wba55/ and examples/stm32wba65/.
[workspace]
members = ["examples/stm32wba55", "examples/stm32wba65"]
resolver = "2"

[dependencies]
embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-futures = "0.1"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-io = "0.6"
embedded-io-async = "0.6"
heapless = { version = "0.8", default-features = false }
static_cell = "2"

# Optional dependencies
defmt = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }

# embassy-net support (T02 firmware only)
embassy-net-driver = { version = "0.2.0", optional = true }

# NOTE: dependencies needed to build the example programs live in the
# per-board example crates (examples/stm32wba55, examples/stm32wba65), not
# here, so the library's manifest stays board-agnostic.

[features]
default = ["mission-t01"]

# Firmware architecture selection (mutually exclusive)
# T01: TCP/IP stack runs on the ST67W611 module (AT command sockets)
# T02: TCP/IP stack runs on the host MCU (embassy-net integration)
mission-t01 = []
mission-t02 = ["dep:embassy-net-driver"]

# Logging
defmt = ["dep:defmt", "embassy-executor/defmt", "embassy-sync/defmt", "embassy-time/defmt", "heapless/defmt-03"]
log = ["dep:log"]

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
